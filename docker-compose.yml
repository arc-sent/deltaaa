services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS:-}
      # Ключ шифрования VK-токенов. Если задан — используется вместо data/token.key.
      # Менять после того, как токены уже зашифрованы, нельзя (расшифровка сломается).
      - TOKEN_KEY=${TOKEN_KEY:-}
      # Как часто снимать число подписчиков (минуты).
      - COLLECT_INTERVAL_MINUTES=${COLLECT_INTERVAL_MINUTES:-60}
      # Ежедневный дайджест (МСК). Пустой DIGEST_HOUR — рассылка выключена.
      - DIGEST_HOUR=${DIGEST_HOUR:-10}
      - DIGEST_MINUTE=${DIGEST_MINUTE:-0}
      - ERROR_RETENTION_DAYS=${ERROR_RETENTION_DAYS:-5}
      - ERROR_CLEANUP_INTERVAL_DAYS=${ERROR_CLEANUP_INTERVAL_DAYS:-5}
    volumes:
      # БД снимков, ключ шифрования и состояние бота — сохраняются на хосте.
      - ./data:/app/data
